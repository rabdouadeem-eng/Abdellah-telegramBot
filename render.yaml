services:
  - type: web
    name: abdellah-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTHORIZED_USER_ID
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: abdellah-telegram-bot
          property: exurl
